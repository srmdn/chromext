<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="24" fill="#1e88e5"/>
  <!-- magnifying glass -->
  <circle cx="50" cy="52" r="22" fill="none" stroke="#fff" stroke-width="4.5"/>
  <line x1="66" y1="68" x2="84" y2="86" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <!-- bar chart inside lens -->
  <rect x="40" y="56" width="4" height="8" rx="1" fill="#fff" opacity="0.5"/>
  <rect x="47" y="50" width="4" height="14" rx="1" fill="#fff" opacity="0.7"/>
  <rect x="54" y="52" width="4" height="12" rx="1" fill="#fff" opacity="0.6"/>
  <!-- score -->
  <text x="98" y="58" font-family="monospace" font-size="26" fill="#fff" font-weight="bold" text-anchor="middle">100</text>
  <text x="98" y="76" font-family="sans-serif" font-size="11" fill="#bbdefb" text-anchor="middle">score</text>
</svg>
