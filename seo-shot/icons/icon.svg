<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b1e"/>
      <stop offset="100%" stop-color="#242528"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- magnifying glass -->
  <circle cx="50" cy="50" r="22" fill="none" stroke="#8ab4f8" stroke-width="4"/>
  <line x1="66" y1="66" x2="82" y2="82" stroke="#8ab4f8" stroke-width="5" stroke-linecap="round"/>
  <!-- graph bars inside lens -->
  <rect x="40" y="54" width="5" height="10" rx="1" fill="#8ab4f8" opacity="0.6"/>
  <rect x="48" y="48" width="5" height="16" rx="1" fill="#8ab4f8" opacity="0.8"/>
  <rect x="56" y="50" width="5" height="14" rx="1" fill="#8ab4f8" opacity="0.7"/>
  <!-- score badge -->
  <text x="96" y="56" font-family="monospace" font-size="22" fill="#8ab4f8" font-weight="bold" text-anchor="middle">100</text>
  <text x="96" y="72" font-family="sans-serif" font-size="10" fill="#9aa0a6" text-anchor="middle">/100</text>
</svg>
