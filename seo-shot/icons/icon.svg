<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 96px blue circle centered -->
  <circle cx="64" cy="64" r="48" fill="#1e88e5"/>
  <!-- magnifying glass -->
  <circle cx="48" cy="52" r="18" fill="none" stroke="#fff" stroke-width="3.5"/>
  <line x1="61" y1="65" x2="76" y2="80" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- bar chart inside lens -->
  <rect x="40" y="56" width="3.5" height="6" rx="1" fill="#fff" opacity="0.5"/>
  <rect x="46" y="50" width="3.5" height="12" rx="1" fill="#fff" opacity="0.7"/>
  <rect x="52" y="52" width="3.5" height="10" rx="1" fill="#fff" opacity="0.6"/>
  <!-- score -->
  <text x="92" y="62" font-family="monospace" font-size="20" fill="#fff" font-weight="bold" text-anchor="middle">100</text>
  <text x="92" y="76" font-family="sans-serif" font-size="9" fill="#bbdefb" text-anchor="middle">score</text>
</svg>
