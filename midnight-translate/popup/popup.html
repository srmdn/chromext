<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Midnight Translate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="title">Midnight Translate</h1>
      <p class="subtitle">Soft midnight mode and accent controls for Google Translate</p>

      <div class="section">
        <button class="mode-button" id="modeButton" type="button">Night mode on</button>
        <p class="mode-hint" id="modeHint"></p>
      </div>

      <div class="section">
        <label class="label">Accent color</label>
        <div class="color-grid" id="colorGrid"></div>
      </div>

      <div class="section preview-section">
        <label class="label">Preview</label>
        <div class="preview-box" id="previewCard" data-state="on">
          <div class="preview-text">
            <span class="preview-label">Input</span>
            <div class="preview-input">Hello, world</div>
          </div>
          <div class="preview-text">
            <span class="preview-label">Output</span>
            <div class="preview-output">Halo, dunia</div>
          </div>
        </div>
      </div>

      <p class="footer-note">Reload Google Translate if an older open tab does not repaint immediately.</p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
